name: Release Quick Terminal

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quickterm-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'jonigkeit/ghostty' && github.ref == 'refs/heads/feat/quickterm-with-tab'
    # Explicitly provisioned Mac only. Never use a hosted macOS runner.
    runs-on: [self-hosted, macOS, ghostty-build]
    timeout-minutes: 90
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record immutable build identity
        id: version
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
      - name: Check preinstalled build dependencies
        run: |
          for tool in zig nu xcodebuild msgfmt pandoc python3; do
            command -v "$tool" || { echo "Missing preinstalled tool: $tool" >&2; exit 1; }
          done
          required_zig=$(sed -nE 's/^[[:space:]]*\.minimum_zig_version = "([^"]+)".*/\1/p' build.zig.zon)
          if [[ $(zig version) != "$required_zig" ]]; then
            echo "The runner requires Zig $required_zig; no tools will be installed by this workflow." >&2
            exit 1
          fi
      - name: Check synchronization behavior
        run: python3 .github/scripts/quickterm/test_sync.py
      - name: Build and verify universal app
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/quickterm/build-macos.sh "$RELEASE_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quickterm-macos
          path: dist/quickterm/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ needs.build.outputs.sha }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/quickterm-with-tab
          fetch-depth: 0
      - name: Reject stale builds
        run: |
          if [[ $(git rev-parse HEAD) != "$SOURCE_SHA" ]]; then
            echo 'Integration branch changed during this build; run Release Quick Terminal again.' >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: quickterm-macos
          path: dist/quickterm/
      - name: Verify download and render Homebrew cask
        run: |
          (cd dist/quickterm && sha256sum -c SHA256SUMS)
          python3 .github/scripts/quickterm/write-cask.py \
            "$REPOSITORY" "$RELEASE_VERSION" \
            dist/quickterm/ghostty-quickterm-universal.zip Casks/ghostty-quickterm.rb
          ruby -c Casks/ghostty-quickterm.rb
      - name: Publish immutable prerelease
        run: |
          {
            printf 'Universal macOS build of %s, including ghostty-org/ghostty#9857.\n\n' "$SOURCE_SHA"
            echo 'This is an ad-hoc signed personal build, without Apple notarization.'
            echo 'Install and update using the Homebrew instructions in QUICKTERM.md.'
          } > "$RUNNER_TEMP/quickterm-release.md"
          gh release create "quickterm-$RELEASE_VERSION" \
            --repo "$REPOSITORY" --target "$SOURCE_SHA" --prerelease --latest=false \
            --title "Quick Terminal $RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/quickterm-release.md" \
            dist/quickterm/ghostty-quickterm-universal.zip dist/quickterm/SHA256SUMS
      - name: Update Homebrew tap
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Casks/ghostty-quickterm.rb
          git commit -m "Update Quick Terminal cask to $RELEASE_VERSION"
          git push origin HEAD:refs/heads/feat/quickterm-with-tab
          echo "Published quickterm-$RELEASE_VERSION and updated Casks/ghostty-quickterm.rb" >> "$GITHUB_STEP_SUMMARY"
