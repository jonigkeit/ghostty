name: Sync Quick Terminal upstreams

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quickterm-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'jonigkeit/ghostty'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      sha: ${{ steps.sync.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/quickterm-with-tab
          fetch-depth: 0
      - name: Configure upstreams and commit identity
        run: |
          git remote add ghostty https://github.com/ghostty-org/ghostty.git
          git remote add adrum https://github.com/adrum/ghostty.git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Merge and push upstream changes
        id: sync
        run: bash .github/scripts/quickterm/sync.sh

  # A GITHUB_TOKEN push does not trigger a push workflow. Explicitly call the
  # reusable release workflow so daily updates also produce a new release.
  release:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/quickterm-release.yml
    with:
      source_sha: ${{ needs.sync.outputs.sha }}
