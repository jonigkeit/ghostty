name: Sync Quick Terminal upstreams

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quickterm-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'jonigkeit/ghostty'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check sync credential
        env:
          SYNC_KEY: ${{ secrets.QUICKTERM_SYNC_SSH_KEY }}
        run: |
          if [[ -z "$SYNC_KEY" ]]; then
            echo 'Set QUICKTERM_SYNC_SSH_KEY to the repository write deploy key; see QUICKTERM.md.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/quickterm-with-tab
          fetch-depth: 0
          # Upstream merges can change workflow files. GITHUB_TOKEN cannot
          # write those files; use a deploy key scoped to this fork instead.
          ssh-key: ${{ secrets.QUICKTERM_SYNC_SSH_KEY }}
      - name: Configure upstreams and commit identity
        run: |
          git remote add ghostty https://github.com/ghostty-org/ghostty.git
          git remote add adrum https://github.com/adrum/ghostty.git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Merge and push upstream changes
        id: sync
        run: bash .github/scripts/quickterm/sync.sh

      # Releases are dispatched manually on an explicitly provisioned Mac.
